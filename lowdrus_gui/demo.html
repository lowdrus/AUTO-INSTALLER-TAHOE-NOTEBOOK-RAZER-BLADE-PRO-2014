<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOWDRUS GUI Component</title>
<link rel="stylesheet" href="lowdrus-gui.css">
<style>html,body{margin:0;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}#app{height:100vh}.panel{position:absolute;left:32px;top:32px;padding:18px 22px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px)}button{padding:8px 12px;margin-right:6px;border:0;border-radius:8px;cursor:pointer}</style>
</head>
<body><div id="app"></div>
<script src="lowdrus-gui.js"></script>
<script>
const gui=LowdrusGUI.mount('#app',{dim:false,muted:true,content:'<div class="panel"><b>LOWDRUS GUI</b><br><small>Área de conteúdo da sua aplicação</small><br><br><button onclick="gui.play()">▶ Play</button><button onclick="gui.pause()">⏸ Pausar</button></div>'});
</script>
</body></html>
